addEventListener('message',e=>{if(e.source!==parent||e.data?.channel!=='free-game120-reply')return;const p=pending.get(e.data.request);if(!p)return;clearTimeout(p.timer);pending.delete(e.data.request);e.data.error?p.reject(Error(e.data.error)):p.resolve(e.data.result)});

function fail(e){if(!snapshot){$('loading').hidden=false;$('dots').hidden=false;$('loading-message').textContent='Connecting…';$('retry').hidden=true}else{$('round-caption').textContent='Reconnecting…'}buttons()}
function chip(value){const span=document.createElement('span');span.className='chip'+(value>=10?' pink':value>=2?' purple':'');span.textContent=Number(value).toFixed(2)+'x';return span}
function paint(s){if(snapshot&&((s.revision||0)<(snapshot.revision||0)||((s.revision||0)===(snapshot.revision||0)&&s.serverNow<snapshot.serverNow)))return;const before=snapshot;if(before?.round?.id===s.round?.id){s.publicPlays??=before.publicPlays;s.previousPlays??=before.previousPlays}snapshot=s;received=performance.now();$('loading').hidden=true;$('coins').textContent=Number(s.coins).toFixed(2);$('round-caption').textContent='Live round '+(s.round?.id.split('-').at(-1)||'');for(const el of [$('recent'),$('history-grid')]){el.replaceChildren();for(const h of s.roundHistory||[])el.append(chip(h.multiplier))}if(before){for(const lane of [1,2]){const b=s.round?.bets?.[lane],prev=before.round?.bets?.[lane];if(b?.status==='won'&&prev?.status==='active'){toast('Collected '+b.payout.toFixed(2)+' free coins at '+b.multiplier.toFixed(2)+'x',true);sound('win')}}}buttons();renderFeed();maybeAuto()}
function buttons(){const r=snapshot?.round,fresh=snapshot&&performance.now()-received<3500;for(const lane of [1,2]){const b=r?.bets?.[lane],active=b?.status==='active',button=$('action'+lane);button.classList.toggle('collect',active&&r?.state==='flying');button.classList.toggle('queued',active&&r?.state==='waiting');button.firstChild.textContent=busy[lane]?'…':active?(r.state==='flying'?'Cashout':'Waiting'):'Bet';button.disabled=!!busy[lane]||!fresh||active&&r?.state!=='flying'||!active&&(r?.state!=='waiting'||!!b);$('amount'+lane).disabled=!!busy[lane]||!!b;$('action-amount'+lane).textContent=(active?Math.floor(b.amount*(r?.multiplier||1)):Math.max(1,Number($('amount'+lane).value)||1)).toFixed(2)+' Coins'}}

function maybeAuto(){const r=snapshot?.round;if(!r||r.state!=='waiting')return;for(const lane of [1,2])if($('repeat'+lane).checked&&!r.bets?.[lane]&&!busy[lane]&&autoAttempt[lane]!==r.id){autoAttempt[lane]=r.id;play(lane,true)}}
function renderFeed(){const r=snapshot?.round;let rows=feedTab==='previous'?(snapshot?.previousPlays||[]):(snapshot?.publicPlays||[]);rows=rows.map(v=>({...v,status:v.status==='active'&&(feedTab==='previous'||r?.state==='crashed')?'lost':v.status}));if(feedTab==='top')rows=rows.filter(v=>v.status==='won').sort((a,b)=>b.payout-a.payout);$('play-count').textContent=rows.length+' '+(feedTab==='previous'?'previous':'live')+' plays'+(rows.length>=100?' · latest 100':'');$('total-win').textContent=rows.reduce((sum,v)=>sum+(v.payout||0),0).toFixed(2);$('feed-rows').replaceChildren();if(!rows.length){const empty=document.createElement('p');empty.className='empty';empty.textContent=feedTab==='previous'?'No plays in the previous round.':'No plays to show yet.';$('feed-rows').append(empty)}for(const v of rows){const row=document.createElement('div');row.className='feed-row'+(v.status==='won'?' win':'');const player=document.createElement('span'),avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=(v.player||'P').slice(-1);player.append(avatar,document.createTextNode(v.player||'Player'));row.append(player);for(const text of [Number(v.amount||0).toFixed(2),v.multiplier?Number(v.multiplier).toFixed(2)+'x':'—',v.payout?Number(v.payout).toFixed(2):'—']){const cell=document.createElement('span');cell.textContent=text;if(v.status==='won')cell.className='gain';row.append(cell)}$('feed-rows').append(row)}}
