<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Withdrawal payment methods</title>
<style>
:root{--bg:#dce6eb;--ink:#687b80}*{box-sizing:border-box}html,body{margin:0;width:100%;background:var(--bg);font:14px Arial,Helvetica,sans-serif;color:var(--ink)}.section{padding:17px 12px 20px}.section+.section{border-top:16px solid white}.section h2{text-align:center;font-size:17px;font-weight:400;color:#727b7e;margin:0 0 17px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.method{border:0;background:white;border-radius:4px;min-height:138px;padding:14px 5px 12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;color:#7b8589}.method:active{transform:scale(.985)}.logo{height:64px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(17px,4vw,29px);line-height:1.1;letter-spacing:-.8px}.name{font-size:14px;min-height:26px;display:grid;place-items:center;text-align:center}.nagad{color:#e54623}.bkash{color:#bd1b63}.rocket{color:#7b2588}.neteller{color:#77b53c;font-style:italic}.skrill{color:#7e226a;font-size:29px}.astro{color:#050505;font-size:27px}.payz{color:#111;font-size:31px}.payz::after{content:'●';color:#c6f000;font-size:18px}.free{display:inline-block;background:#ff925a;color:white;padding:8px 10px;border-radius:7px;font-size:14px}.modal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center}.modal[hidden]{display:none}.sheet{background:white;border-radius:16px 16px 0 0;width:100%;max-width:500px;padding:22px 18px calc(22px + env(safe-area-inset-bottom));color:#355b63}.sheet h3{margin:0 0 12px;font-size:20px}.sheet p{line-height:1.55}.ok{border:0;background:#138b9a;color:white;padding:12px 16px;border-radius:8px;width:100%;font-size:16px}.note{padding:12px 15px;text-align:center;color:#70858c;font-size:12px}@media(min-width:700px){main{max-width:800px;margin:auto}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.method{min-height:160px}}
</style></head><body><main id="main"></main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden><div class="sheet"><h3 id="modalTitle"></h3><p id="modalText"></p><button class="ok" id="close" type="button">OK</button></div></div>
<script>
'use strict';
// This file intentionally contains no header/account details: index.html owns them.
const sections=[
 ['RECOMMENDED',[['Nagad','nagad','নগদ'],['Nagad','nagad','◉'],['Bkash Free','free','bKash Free'],['bKash','bkash','bKash ◢']]],
 ['E-WALLETS',[['Nagad','nagad','নগদ'],['Nagad','nagad','◉'],['AstroPay','astro','AstroPay'],['Payz','payz','payz'],['Neteller','neteller','NETELLER'],['Skrill','skrill','Skrill'],['Bkash Free','free','bKash Free'],['bKash','bkash','bKash ◢'],['Rocket','rocket','রকেট']]]
];
const main=document.getElementById('main');
for(const [heading,items] of sections){const section=document.createElement('section');section.className='section';const title=document.createElement('h2');title.textContent=heading;section.append(title);const grid=document.createElement('div');grid.className='cards';for(const [name,kind,word] of items){const button=document.createElement('button');button.type='button';button.className='method';button.setAttribute('aria-label',name);const logo=document.createElement('span');logo.className='logo '+kind;const inner=document.createElement('span');inner.textContent=word;if(kind==='free')inner.className='free';logo.append(inner);const caption=document.createElement('span');caption.className='name';caption.textContent=name;button.append(logo,caption);button.addEventListener('click',()=>openMethod(name));grid.append(button)}section.append(grid);main.append(section)}
const modal=document.getElementById('modal');function openMethod(name){document.getElementById('modalTitle').textContent=name;document.getElementById('modalText').textContent='This withdrawal method has not been configured yet. Please connect the existing withdrawal workflow in index.html before enabling requests.';modal.hidden=false}function closeMethod(){modal.hidden=true}document.getElementById('close').addEventListener('click',closeMethod);modal.addEventListener('click',e=>{if(e.target===modal)closeMethod()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeMethod()});
</script></body></html>
