<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>120xBet Virtual Football</title><style>*{box-sizing:border-box}body{margin:0;background:#071b24;color:#f2fafb;font:16px system-ui}header,main{max-width:850px;margin:auto;padding:18px}header{display:flex;gap:12px;align-items:center}h1{font-size:22px;margin:0}a{color:#71e5c0}section{padding:20px;background:#102e38;border-radius:20px;margin-bottom:16px}.notice{background:#453b20;color:#fff0b3;line-height:1.6}#teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:12px;font-size:22px;font-weight:bold}#score{font-size:38px;white-space:nowrap}#clock{text-align:center;font-size:30px;font-variant-numeric:tabular-nums;margin:18px}#phase{text-align:center;color:#71e5c0}canvas{width:100%;display:block;border-radius:14px;background:#206b3d}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #638088;max-width:100%}input{display:block;width:100%;margin:8px 0 16px;background:#f4fafc;color:#193340}button{background:#30cc99;color:#062c23;cursor:pointer}button:disabled{opacity:.5}label{display:block}small{color:#b5cbd0}#status{min-height:24px;margin-bottom:14px;color:#ffdb8b}.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}[hidden]{display:none!important}li{margin:8px 0}.badge{color:#65dfb3;font-size:12px}#admin{margin-top:16px}</style><header><a href="javascript:history.back()" aria-label="Back">←</a><h1>Virtual Football <span class="badge">SIMULATION</span></h1></header><main><section class="notice">এটি বাস্তব ফুটবল সম্প্রচার নয়। ভার্চুয়াল অ্যানিমেশন; অ্যাডমিন ফল ও গোল পরিবর্তন করতে পারেন। কোনো টাকা বা বাজি নেই।</section><div id="status" role="status">সার্ভারে সংযোগ হচ্ছে…</div><section><div id="teams"><span id="home">Home</span><span id="score">— : —</span><span id="away">Away</span></div><div id="clock">00:00</div><div id="phase">ম্যাচের অপেক্ষা</div><canvas id="pitch" width="960" height="5 const $=id=>document.getElementById(id),endpoint='https://120xbet-free-game.mdripon018770.workers.dev/';let match=null,offset=0,lastSync=0,busy=false,auth=null;

function timing(){if(!match)return {seconds:0,phase:'waiting'};const now=Date.now()+offset,t=now-match.startAt;if(t<0)return {seconds:0,phase:'scheduled',left:Math.ceil(-t/1000)};if(t<2700000)return {seconds:Math.floor(t/1000),phase:'first_half'};if(t<3600000)return {seconds:2700,phase:'half_time',left:Math.ceil((3600000-t)/1000)};if(t<6300000)return {seconds:Math.floor((t-900000)/1000),phase:'second_half'};return {seconds:5400,phase:'finished'}}

function accept(s){match=s.match;if(match)offset=match.serverNow-Date.now();lastSync=Date.now();$('status').textContent=match?'ভার্চুয়াল ম্যাচ · সার্ভার সংযুক্ত':'';render()}
async function poll(){if(busy||document.hidden)return;busy=true;try{accept(await rpc('virtualFootballState'))}catch(e){$('status').textContent=e.message+' · আবার চেষ্টা হচ্ছে।'}finally{busy=false}}
setInterval(poll,5000);setInterval(render,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});poll();
const canvas=$('pitch'),c=canvas.getContext('2d');function draw(){const t=timing(),playing=['first_half','second_half'].includes(t.phase)&&Date.now()-lastSync<20000,sec=playing?(Date.now()+offset-match.startAt)/1000:0;c.fillStyle='#227640';c.fillRect(0,0,960,580);for(let i=0;i<10;i++){c.fillStyle=i%2?'#267e45':'#227640';c.fillRect(i*96,0,96,580)}c.strokeStyle='#c8e3cf';c.lineWidth=3;c.strokeRect(35,35,890,510);c.beginPath();c.moveTo(480,35);c.lineTo(480,545);c.stroke();c.beginPath();c.arc(480,290,70,0,Math.PI*2);c.stroke();c.strokeRect(35,155,130,270);c.strokeRect(795,155,130,270);c.strokeRect(15,240,20,100);c.strokeRect(925,240,20,100);for(let team=0;team<2;team++)for(let i=0;i<11;i++){const col=i===0?0:1+(i-1)%3,row=i===0?2:Math.floor((i-1)/3),x=team?900-col*94:60+col*94,y=i===0?290:90+row*125;c.fillStyle=team?'#f5c45c':'#65baff';c.beginPath();c.arc(x+Math.sin(sec*.6+i)*12,y+Math.cos(sec*.4+i)*18,12,0,Math.PI*2);c.fill();c.fillStyle='#0b2730';c.font='13px Arial';c.fillText(String(i+1),x-5+Math.sin(sec*.6+i)*12,y+4+Math.cos(sec*.4+i)*18)}c.fillStyle='white';c.beginPath();c.arc(480+Math.sin(sec*.19)*300,290+Math.cos(sec*.33)*170,8,0,Math.PI*2);c.fill();requestAnimationFrame(draw)}draw();

</script></html>
