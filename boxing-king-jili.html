const $=id=>document.getElementById(id);let balance=0,currency='BDT',bet=4,busy=false,auto=false,turbo=false;
const symbols=['fighter','glove','wild','blue','elder'];const board=$('board');
function money(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function tileSet(el,key){el.className='tile '+(['fighter','glove'].includes(key)?'red':['blue','elder'].includes(key)?'blue':'gold');el.firstElementChild.src=images[key]}
for(let r=0;r<5;r++)for(let c=0;c<5;c++){const key=symbols[c],el=document.createElement('div'),im=document.createElement('img');im.alt=key;im.draggable=false;el.appendChild(im);tileSet(el,key);board.appendChild(el)}
function refresh(){document.querySelectorAll('.currency').forEach(x=>x.textContent=currency);$('betCurrency').textContent=currency;$('topBalance').textContent=money(balance);$('balance').textContent=money(balance);$('bet').textContent=bet}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function spin(){if(busy)return;busy=true;$('spinBtn').disabled=true;$('win').textContent='0.00';$('notice').textContent='';const cells=[...board.children];for(let c=0;c<5;c++)for(let r=4;r>=0;r--){const el=cells[r*5+c];tileSet(el,symbols[Math.floor(Math.random()*symbols.length)]);el.classList.remove('drop');void el.offsetWidth;el.classList.add('drop');await wait(turbo?22:70)}busy=false;$('spinBtn').disabled=false;if(auto){await wait(turbo?80:320);if(auto)spin()}}
$('spinBtn').onclick=()=>{auto=false;$('autoBtn').classList.remove('active');spin()};$('autoBtn').onclick=()=>{auto=!auto;$('autoBtn').classList.toggle('active',auto);if(auto&&!busy)spin()};$('turboBtn').onclick=()=>{turbo=!turbo;$('turboBtn').classList.toggle('active',turbo)};$('betBtn').onclick=()=>{$('betInput').value=bet;$('modal').classList.add('show')};$('cancel').onclick=()=>{$('modal').classList.remove('show')};$('apply').onclick=()=>{const n=Number($('betInput').value);if(Number.isFinite(n)&&n>0){bet=n;refresh();$('modal').classList.remove('show')}};$('star').onclick=()=>{$('star').textContent=$('star').textContent==='☆'?'★':'☆'};$('full').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.()};$('back').onclick=()=>{if(history.length>1)history.back()};
window.addEventListener('message',event=>{if(window.parent===window||event.source!==window.parent)return;const d=event.data;if(!d||d.type!=='BOXING_KING_STATE')return;if(typeof d.currency==='string'&&/^[A-Z]{3,5}$/.test(d.currency))currency=d.currency;if(typeof d.balance==='number'&&Number.isFinite(d.balance)&&d.balance>=0)balance=d.balance;refresh()});refresh();
</script></body></html>
