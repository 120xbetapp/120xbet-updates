<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Account deposits</title>
<style>
:root{--bg:#dce6eb;--ink:#315c65;--green:#0aaf4e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,Helvetica,sans-serif;color:#687b80}.top{position:sticky;top:0;z-index:10;background:#fff;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:0 1px 2px #c7d2d6}.top h1{font-size:22px;font-weight:600;color:#68969d;margin:0}.iconbtn{background:none;border:0;color:#67939b;font-size:34px;line-height:1;cursor:pointer;min-width:38px}.reload{color:#0bb352;font-size:30px}.section{padding:14px 12px 20px}.section h2{text-align:center;font-size:17px;font-weight:400;color:#6c777a;margin:0 0 17px;letter-spacing:.2px}.section+.section{border-top:15px solid #fff}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.method{position:relative;border:0;background:white;min-height:137px;border-radius:4px;padding:13px 5px 11px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;overflow:hidden;color:#7b8589;box-shadow:0 1px 1px #c9d3d633}.method:active{transform:scale(.985)}.logo{height:64px;width:100%;display:flex;align-items:center;justify-content:center;gap:2px;text-align:center;font-weight:800;font-size:clamp(13px,3.5vw,24px);line-height:1.1;letter-spacing:-.7px}.logo .symbol{font-size:24px}.method .name{font-size:13px;line-height:1.25;font-weight:400;min-height:32px;display:flex;align-items:center;justify-content:center;text-align:center}.tag{position:absolute;right:0;top:0;background:#fa1017;color:white;font-size:13px;padding:3px 7px 3px 13px;clip-path:polygon(13px 0,100% 0,100% 100%,0 100%)}.bkash{color:#c51a68}.nagad{color:#e24621}.rocket{color:#812184}.neteller{color:#73b331;font-style:italic}.skrill{color:#782269;font-size:26px}.astro{color:#080808}.orange{color:#fff;background:#ff9056;border-radius:6px;padding:8px;font-size:13px}.black{color:white;background:#080808;padding:8px;font-size:15px}.coin{width:47px;height:47px;border-radius:50%;display:grid;place-items:center;background:#f5f7f8;font-size:26px;font-weight:800}.btc{background:#f39b19;color:#fff}.eth{color:#333}.tron{color:#e22d3e}.usdt{color:#45aa90}.bnb{color:#e7b521}.ltc{background:#3c70a7;color:#fff}.xrp{color:#20252a}.sol{color:#8c64c7}.doge{background:#c6a745;color:#fff}.usd{color:#277fc0}.other{color:#467f9b}.pair{display:flex;gap:3px;align-items:center}.pair .coin{width:35px;height:35px;font-size:19px}.hidden{display:none!important}.overlay{position:fixed;inset:0;z-index:30;background:#0007;display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;width:100%;max-width:500px;border-radius:18px 18px 0 0;padding:22px 20px calc(25px + env(safe-area-inset-bottom));color:#344f56;box-shadow:0 -3px 20px #0002}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet h3{margin:0;font-size:21px}.close{font-size:26px;background:none;border:0;color:#789;cursor:pointer}.sheet p{line-height:1.6;color:#667d82}.info{background:#edf3f5;border-radius:10px;padding:14px;margin:14px 0}.action{background:#168aef;color:white;border:0;border-radius:10px;padding:12px 18px;width:100%;font-size:16px;cursor:pointer}.searchbar{background:#fff;padding:10px 14px;border-bottom:1px solid #e7edef}.searchbar input{width:100%;padding:12px;border:1px solid #cbd9df;border-radius:8px;font-size:15px;outline-color:#6c9}.noresults{text-align:center;padding:35px 0;color:#637d85}.footer{text-align:center;padding:16px;font-size:12px;color:#7b8c91}@media(min-width:700px){main{max-width:780px;margin:auto}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.method{min-height:160px}.method .name{font-size:15px}.top{justify-content:space-around}}
</style></head><body>
<main id="main"></main>
<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="methodTitle"><div class="sheet"><div class="sheet-head"><h3 id="methodTitle"></h3><button class="close" id="close" aria-label="Close">×</button></div><div class="info" id="methodInfo"></div><p id="methodText"></p><button class="action" id="done">OK</button></div></div>
<script>
'use strict';
const methods=[
['RECOMMENDED', [['Bkash P2P','bkash','bKash',''],['Nagad p2c','nagad','নগদ',''],['bKash','bkash','bKash','P2P'],['Nagad','nagad','নগদ','P2P'],['Bkash Free','free','bKash Free','P2P'],['Nagad Free','nagadfree','নগদ Free','P2P'],['Rocket','rocket','রকেট','P2P'],['Neteller','neteller','NETELLER','']]],
['E-WALLETS', [['bKash','bkash','bKash','P2P'],['Nagad','nagad','নগদ','P2P'],['Bkash Free','free','bKash Free','P2P'],['Nagad Free','nagadfree','নগদ Free','P2P'],['Rocket','rocket','রকেট','P2P'],['AstroPay','astro','AstroPay',''],['Skrill','skrill','Skrill',''],['Neteller','neteller','NETELLER',''],['Skrill 1-Tap','skrill','Skrill 1-Tap',''],['iCash.One','icash','icash.one','50% cashback']]],
['BANK TRANSFER', [['Bkash P2P','bkash','bKash',''],['Nagad p2c','nagad','নগদ','']]],
['CRYPTOCURRENCY', [['Bitcoin','btc','₿',''],['Ethereum','eth','◆',''],['TRON','tron','◈',''],['Dogecoin','doge','Ð',''],['Binance Coin BSC','bnb','⬡',''],['Tether on BSC','usdtbnb','₮ ⬡',''],['Tether on Ethereum','usdteth','₮ ◆',''],['Tether on Tron','usdttron','₮ ◈',''],['Litecoin','ltc','Ł',''],['USD Coin on Ethereum','usdeth','$ ◆',''],['XRP','xrp','✕',''],['Cosmos Atom','other','⚛',''],['Solana','sol','≋',''],['Tether on Solana','usdtsol','₮ ≋',''],['USD Coin on Solana','usdsol','$ ≋',''],['Polygon','sol','⬡',''],['DigiByte','other','D',''],['Bitcoin Cash','btc','₿',''],['QTUM','other','◉',''],['Dash','other','D',''],['Ethereum on Optimism','eth','◆ OP',''],['Tether on Optimism','usdt','₮ OP',''],['USD Coin on Optimism','usd','$ OP',''],['Bridged USD Coin on Optimism','usd','$ OP',''],['SHIBA INU on Ethereum','eth','🐕 ◆',''],['Stellar','other','✺',''],['Algorand','other','Ⱥ','']]]
];
const main=document.getElementById('main');
function logo(type,label){if(['bkash','nagad','rocket','neteller','skrill','astro'].includes(type))return `<span class="logo ${type}">${label}</span>`;if(type==='free')return `<span class="logo"><span class="orange">➤ ${label}</span></span>`;if(type==='nagadfree')return `<span class="logo"><span class="black">◉ ${label}</span></span>`;if(type==='icash')return `<span class="logo"><span class="black">${label}</span></span>`;let cls=type.startsWith('usdt')?'usdt':type.startsWith('usd')?'usd':type;return `<span class="logo"><span class="coin ${cls}">${label}</span></span>`}
function render(filter=''){main.replaceChildren();let total=0;for(const [heading,items] of methods){const selected=items.filter(m=>m[0].toLowerCase().includes(filter.toLowerCase()));if(!selected.length)continue;total+=selected.length;const sec=document.createElement('section');sec.className='section';const h=document.createElement('h2');h.textContent=heading;sec.append(h);const grid=document.createElement('div');grid.className='cards';for(const [name,type,brand,tag] of selected){const btn=document.createElement('button');btn.className='method';btn.type='button';btn.setAttribute('aria-label',name);btn.innerHTML=logo(type,brand)+(tag?`<span class="tag">${tag}</span>`:'')+'<span class="name"></span>';btn.querySelector('.name').textContent=name;btn.addEventListener('click',()=>show(name));grid.append(btn)}sec.append(grid);main.append(sec)}if(!total){const p=document.createElement('p');p.className='noresults';p.textContent='No payment methods found.';main.append(p)}}
const overlay=document.getElementById('overlay');function show(name){document.getElementById('methodTitle').textContent=name;document.getElementById('methodInfo').textContent='Payment method: '+name;document.getElementById('methodText').textContent='This payment method is not configured yet. The administrator must provide verified payment details before deposits can be submitted.';overlay.classList.remove('hidden')};function close(){overlay.classList.add('hidden')}document.getElementById('close').onclick=close;document.getElementById('done').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script></body></html>
