<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>120xBet Master Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#152e41;font:15px system-ui,Arial}header{background:#102d45;color:white;padding:18px;font-size:19px;font-weight:800}main{max-width:1050px;margin:auto;padding:14px}.intro,.panel{background:white;border-radius:16px;padding:17px;box-shadow:0 4px 15px #19334c12;margin-bottom:14px}.muted{color:#63798b;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:white;border:1px solid #e1e8ee;border-radius:14px;padding:16px;text-align:left;min-height:112px;color:#193448;font:inherit;cursor:pointer}.tile b{display:block;margin:9px 0 3px}.tile span{font-size:26px}.tile small{color:#667d8a}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{cursor:pointer;background:#087e91;color:white;border:0;border-radius:9px;padding:10px 13px;font-weight:700}button:disabled{background:#a9b6be;cursor:not-allowed}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd6df;border-radius:8px;font:inherit;margin:6px 0 12px}textarea{min-height:90px}label{display:block;font-size:13px;font-weight:700}h2{font-size:18px;margin:0 0 12px}.notice{background:#e8f3f7;padding:12px;border-radius:9px;margin:12px 0}.warning{background:#fff5df;border-left:4px solid #d9a142;padding:12px;margin:12px 0}.hidden{display:none!important}.record{padding:12px;border-bottom:1px solid #e5eaf0}.tag{background:#e6f0f5;border-radius:12px;padding:4px 8px;font-size:12px}.secondary{background:#536e80}@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><header>120xBet · Master Admin</header><main>
<div class="intro"><b>Master Control Dashboard</b> <span class="tag">No-login interface</span><p class="muted">ড্যাশবোর্ড সরাসরি খোলে। লাইভ ইউজার তথ্য ও সংবেদনশীল পরিবর্তন অনুমোদিত সার্ভার সংযোগ ছাড়া করা যাবে না।</p><div id="connection" class="notice">Backend status: Not connected — protected operations unavailable.</div></div>
<div id="home"><div class="grid" id="tiles"></div></div>
<div id="detail" class="hidden"><button id="back" class="secondary">← Dashboard</button><div class="panel" style="margin-top:12px"><h2 id="heading"></h2><div id="content"></div></div></div>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
const areas=[['users','👥','Users','Registration and account search'],['wallet','💳','Wallet','Balance and transactions'],['deposit','📥','Deposit','Review requests'],['withdraw','📤','Withdrawal','Review requests'],['sports','🏆','Sports','Matches and odds'],['casino','🎮','Casino','Games and categories'],['support','💬','Support','User conversations'],['notice','🔔','Notifications','Announcement drafts'],['methods','⚙️','Payment Methods','Payment method drafts'],['banner','📢','Banners','Announcement drafts'],['partners','🤝','Partners','Referral reports'],['roles','🛡️','Admin Roles','Access and permissions'],['audit','📋','Audit Logs','Local interface activity'],['system','🔧','System','Diagnostics and export']];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storeKey='xbet_master_local_drafts_v2';let drafts={};try{drafts=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch{};
function save(){try{localStorage.setItem(storeKey,JSON.stringify(drafts));return true}catch(e){alert('Local save failed: '+e.message);return false}}
function log(action){drafts.audit=Array.isArray(drafts.audit)?drafts.audit:[];drafts.audit.unshift({at:new Date().toISOString(),action});drafts.audit=drafts.audit.slice(0,100);save()}
function show(id){$('home').classList.toggle('hidden',id!=='home');$('detail').classList.toggle('hidden',id==='home');if(id==='home')return;const area=areas.find(a=>a[0]===id);$('heading').textContent=area?area[2]:id;const c=$('content');c.replaceChildren();if(['notice','banner','methods'].includes(id)){
const label=document.createElement('p');label.className='notice';label.textContent='এখানে লেখা Local Draft হিসেবে সেভ হবে। User App-এ Publish হবে না, যতক্ষণ না অনুমোদিত Backend যুক্ত হয়।';c.append(label);
if(id==='methods'){const name=document.createElement('input');name.placeholder='Method name';name.id='methodName';name.value=drafts.methodName||'';c.append(name);const number=document.createElement('input');number.placeholder='Wallet number / address';number.id='methodAddress';number.value=drafts.methodAddress||'';c.append(number);const rate=document.createElement('input');rate.placeholder='Display rate';rate.id='methodRate';rate.value=drafts.methodRate||'';c.append(rate)}else{const input=document.createElement('textarea');input.id='draftText';input.placeholder=id==='notice'?'Write announcement':'Write banner text';input.value=drafts[id]||'';c.append(input)}
const btn=document.createElement('button');btn.textContent='Save Local Draft';btn.onclick=()=>{if(id==='methods'){for(const [k,e] of [['methodName','methodName'],['methodAddress','methodAddress'],['methodRate','methodRate']])drafts[k]=$(e).value}else drafts[id]=$('draftText').value;if(save()){log('Saved '+id+' local draft');alert('Saved on this device only. Not published.')}};c.append(btn);return}
if(id==='audit'){const entries=drafts.audit||[];c.innerHTML=entries.length?entries.map(x=>'<div class="record">'+escapeHTML(x.at)+' — '+escapeHTML(x.action)+'</div>').join(''):'No local actions recorded';return}
if(id==='system'){c.innerHTML='<p class="notice">Static hosting: GitHub Pages. Live Firebase/Worker credentials and server authorization are not present in this no-login build.</p><p>Export your locally saved drafts and interface audit log.</p>';const btn=document.createElement('button');btn.textContent='Export Local Data (JSON)';btn.onclick=()=>{const blob=new Blob([JSON.stringify(drafts,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='120xbet-master-local-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};c.append(btn);return}
const msg=document.createElement('div');msg.className='warning';msg.textContent='এই বিভাগের লাইভ ডেটা বা পরিবর্তন করার জন্য Firebase/Worker-এর অনুমোদিত Admin Session এবং সংশ্লিষ্ট API প্রয়োজন। Login ছাড়া ব্যক্তিগত ইউজার তথ্য, ব্যালেন্স, পেমেন্ট বা গেমের ফলাফল পরিবর্তন নিরাপদ নয়।';c.append(msg);
const explain=document.createElement('p');explain.className='muted';explain.textContent='এই সংস্করণে Navigation কাজ করে, কিন্তু লাইভ '+(area?.[2]||id)+' API যুক্ত নয়। কোনো কৃত্রিম তথ্য দেখানো হচ্ছে না।';c.append(explain)
}
$('tiles').innerHTML=areas.map(([id,icon,title,sub])=>'<button class="tile" data-area="'+id+'"><span>'+icon+'</span><b>'+title+'</b><small>'+sub+'</small></button>').join('');
document.querySelectorAll('[data-area]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.area)));$('back').onclick=()=>show('home');
window.addEventListener('error',e=>{$('connection').textContent='Interface error: '+e.message});
</script></body></html>
